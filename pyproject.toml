[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "commodity-var-engine"
version = "0.1.0"
description = "VaR and Expected Shortfall engine for commodity futures portfolios"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Miguel", email = "miguelaab.dev@gmail.com" }]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "arch>=6.2",          # GARCH models (Kevin Sheppard)
    "yfinance>=0.2.31",
    "plotly>=5.18",
    "kaleido>=0.2.1",     # static image export for Plotly
    "pyyaml>=6.0",
    "click>=8.1",         # CLI
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.7",
    "ruff>=0.1.6",
    "pandas-stubs>=2.1",
    "ipykernel>=6.27",
    "jupyter>=1.0",
    "nbstripout>=0.6",   # strip notebook output before committing
]

[project.scripts]
varengine = "varengine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102"]  # don't require self/cls annotations

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["yfinance.*", "arch.*", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=varengine --cov-report=term-missing -v"
markers = [
    "slow: marks tests that hit the network or run long simulations",
]
